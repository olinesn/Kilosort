name: Windows ARM tests

# Runs Kilosort's own test suite, including the full sort of the test
# recording (--runslow), on a native Windows 11 ARM64 runner, CPU only.
on:
  push:
    branches: [windows-arm-test]
  workflow_dispatch:

jobs:
  test:
    name: windows-11-arm py${{ matrix.python }}
    runs-on: windows-11-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64

      - name: Machine
        run: |
          "KILOSORT_LOCAL_DOWNLOADS_PATH=$env:RUNNER_TEMP\ks-data" >> $env:GITHUB_ENV
          python -c "import platform, sys; print(platform.machine(), platform.platform(), sys.version)"
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors
          Get-CimInstance Win32_ComputerSystem | Format-List TotalPhysicalMemory
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, OSArchitecture

      - name: Install Kilosort (PyTorch from its CPU index)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" pytest psutil --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip list

      - name: Native ARM64 stack and OpenMP check
        timeout-minutes: 10
        run: python .github/arm/check_env.py

      - name: GUI smoke test
        continue-on-error: true
        timeout-minutes: 5
        run: python .github/arm/gui_smoke.py

      - name: Fast tests
        timeout-minutes: 60
        run: python -m pytest -v -s -p no:cacheprovider tests

      - name: Full sort of the test recording (--runslow)
        timeout-minutes: 180
        run: python -m pytest --runslow -v -s -p no:cacheprovider tests/test_full_pipeline.py

      - name: Upload Kilosort logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kilosort-logs-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/ks-data/**/*.log
            ${{ runner.temp }}/ks-data/**/*.txt
          if-no-files-found: ignore
